# Seed Schema drafted from the author's theory. Theory vocabulary lives here, never in core.
# Core memories -> (irrational abduction) -> core beliefs -> derived belief graph
#   -> constrains cognitive appraisals (component process model) and perception.
# Suffering persists via causal feedback loops.
#
# v2 (from the first real entries): part relations (protects, polarized_with, enacts,
# felt_as), plus label styles and display hints per node type.
# v3: people (person, involves, about); descriptions in everyday words, since the app shows
# them to the person; `guidance` for models telling look-alike types apart; key groups.
name: author
version: 3
description: Core memories, belief derivation, appraisals, parts and feedback loops.

nodeTypes:
  part:
    description: A side of you with its own aims and ways of coping, like a part that hides or a part that takes control.
    guidance: >-
      An inner sub-personality that wants something and acts through policies. Name it by what
      it does ("The Hider"). One node per part, however strongly it shows up. Real people are
      person, not part.
    label: name
    labelHint: a short name for the part, e.g. "The Hider" or "The Controller"
    display: { shape: ellipse, color: "#8e7dbe", group: Who }
    attributes:
      context: { type: string }
      policies: { type: string }
      intent: { type: string, description: What the part is trying to achieve or protect }
  person:
    description: Someone in your life, or a group of people, like your dad, your manager or your team.
    guidance: >-
      A real person or group outside the writer. Only add one who matters to a memory, event,
      belief or expectation, and link them to it. The writer's own inner sides are part.
    label: name
    labelHint: how the writer refers to them, e.g. "Dad", "My manager"
    display: { shape: ellipse, color: "#5b6b7a", group: Who }
    attributes:
      kind: { type: enum, values: [person, group, organisation] }
  core_memory:
    description: A memory, usually from long ago, that shaped how you see things. It may still be felt in the body.
    guidance: >-
      Formative and usually from childhood or long ago; beliefs were drawn from it. A recent or
      one-off happening that sets something off now is an event.
    label: title
    labelHint: a few words naming the episode, e.g. "Laughed at, dinner table (7)"
    display: { shape: round-octagon, color: "#b08968", group: What happened }
    attributes:
      episodic: { type: string, description: What happened, in the person's words }
      somatic_signature: { type: string, description: How it is felt in the body }
      age: { type: string }
  event:
    description: Something that happened at a particular time.
    guidance: A specific, usually recent happening that sets off a part, a reading of the situation or a habit. If beliefs grew from it long ago, it is a core_memory.
    label: title
    labelHint: a few words naming what happened, e.g. "Standup, asked for update"
    display: { shape: round-tag, color: "#9c6644", group: What happened }
    attributes:
      time: { type: string }
      context: { type: string }
  belief:
    description: Something you hold to be true about yourself, other people or the world.
    guidance: >-
      General and lasting: it would still be true in the writer's eyes with no situation in view
      ("Needing help makes me a burden"). Reading one situation is an appraisal; expecting how
      others will react is a relational_prediction.
    label: statement
    labelHint: a short first-person statement, e.g. "Needing things drives people away"
    display: { shape: round-rectangle, color: "#7c9885", group: Beliefs and expectations }
    attributes:
      depth: { type: enum, values: [core, derived, leaf] }
      precision: { type: number, description: How strongly held, 0..1 }
  relational_prediction:
    description: What you expect other people to do or feel when you act a certain way.
    guidance: >-
      An expectation about other people's response to the writer, best as if-then ("If I ask,
      people get annoyed"). If no one else is responding, it is a belief.
    label: statement
    labelHint: an if-then, e.g. "If I need, I get punished"
    display: { shape: barrel, color: "#6d8a96", group: Beliefs and expectations }
    attributes: {}
  appraisal:
    description: How you read a kind of situation in the moment, and what it seems to mean for you.
    guidance: >-
      Tied to a kind of situation: what this moment means, often "X = Y" ("Being asked = being
      found out"). If it holds without any situation, it is a belief.
    label: statement
    labelHint: the situation and its meaning, e.g. "Being asked = being exposed"
    display: { shape: rhomboid, color: "#5f8fa8", group: Beliefs and expectations }
    attributes:
      relevance: { type: string }
      implication: { type: string }
      coping: { type: string }
      normative: { type: string }
  policy:
    description: Something you tend to do, again and again, to cope.
    guidance: >-
      An action the writer takes, written as a verb phrase ("Keep scrolling", "Go blank"). Even
      if it feels automatic, it is something done. Something that happens to them (a mood, a
      spiral, tiredness) is a process_node.
    label: name
    labelHint: a verb phrase of one to three words, e.g. "Keep scrolling"
    display: { shape: round-hexagon, color: "#a3a35c", group: What you do }
    attributes:
      kind: { type: enum, values: [avoid, control, collapse, appease, fight, seek, other] }
  process_node:
    description: A state that can build up or ease off, like shame, rumination or lost sleep.
    guidance: >-
      A state or ongoing process of the whole person that rises and falls and can feed loops:
      emotions (shame, fear), mental processes (rumination) and physical states (exhaustion,
      lost sleep). A sensation in a particular place in the body is interoceptive; a
      strategy the writer carries out is a policy.
    label: name
    labelHint: one or two words, e.g. "Shame" or "Rumination"
    display: { shape: round-diamond, color: "#c97b84", group: How it feels }
    attributes: {}
  interoceptive:
    description: A feeling in a particular place in the body, like a tight chest or heat in the face.
    guidance: >-
      A physical sensation with a place in the body ("Tight chest", "Heat in face"). An emotion
      named as an emotion (shame, dread) is a process_node, and felt_as links it to where it is
      felt.
    label: name
    labelHint: location and quality, e.g. "Tight chest"
    display: { shape: round-triangle, color: "#d4a373", group: How it feels }
    attributes:
      location: { type: string }
      quality: { type: string }

edgeTypes:
  abduces:
    description: A belief you took from a memory, whether or not it really follows.
    from: [core_memory]
    to: [belief]
    role: derivational
  scaffolds:
    description: One belief grows out of another, or props it up.
    from: [belief]
    to: [belief, relational_prediction]
    role: derivational
  constrains:
    description: A belief or expectation colours how you read a situation.
    from: [belief, relational_prediction]
    to: [appraisal]
  triggers:
    description: Something that happened sets off a part, a way of reading things, or a habit.
    from: [event]
    to: [part, appraisal, policy]
  reinforces:
    description: One thing makes another stronger (+) or weaker (−).
    from: "*"
    to: "*"
    role: causal
  protects:
    description: A part keeps another part, or a memory, from being felt.
    from: [part]
    to: [part, core_memory]
  polarized_with:
    description: Two parts pull in opposite directions.
    from: [part]
    to: [part]
  enacts:
    description: What a part does to cope.
    from: [part]
    to: [policy]
  felt_as:
    description: Where something is felt in the body.
    from: "*"
    to: [interoceptive]
  stored_as:
    description: Where a memory is still held in the body.
    from: [core_memory]
    to: [interoceptive]
  involves:
    description: Someone who was there, or took part.
    from: [core_memory, event]
    to: [person]
  about:
    description: Who a belief, expectation or reading of a situation is about.
    from: [belief, relational_prediction, appraisal]
    to: [person]
  aspect_of:
    description: One thing is a side, piece or example of another.
    from: "*"
    to: "*"
    role: identity
